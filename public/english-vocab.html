<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="雅思词汇真经">
  <title>雅思词汇真经 - 克睿斯</title>
  <meta name="description" content="雅思词汇真经词卡、音频、检索与英文发音练习。">
  <link rel="stylesheet" href="/assets/english/css/english.css?v=899ca5d2">
</head>
<body class="vocab-standalone-body">
  <div class="vocab-page">
    <header class="topbar vocab-topbar">
      <a class="brand" href="/english.html" aria-label="返回雅思100句">
        <span class="brand-mark">K</span>
        <span>
          <strong>雅思词汇真经</strong>
          <small>词卡 · 音频 · 检索</small>
        </span>
      </a>
      <a class="back-button" href="/english.html">返回 100 句</a>
    </header>

    <main class="vocab-page-main">
      <section class="vocab-hero">
        <span>56 Lists</span>
        <h1>雅思词汇真经</h1>
        <p id="standaloneVocabSummary">词汇真经数据加载中...</p>
        <div class="vocab-hero-stats">
          <strong id="standaloneVocabListStat">L01</strong>
          <strong id="standaloneVocabWordStat">0 词</strong>
          <strong id="standaloneVocabAudioStat">0 音频</strong>
        </div>
      </section>

      <section class="vocab-workbench">
        <div class="vocab-current">
          <span id="standaloneVocabChapter">当前 List</span>
          <h2 id="standaloneVocabTitle">List 01</h2>
          <p id="standaloneVocabRange">选择一个 List 开始学习。</p>
        </div>

        <div class="vocab-list-picker">
          <button id="standaloneVocabPrev" type="button">上一组</button>
          <label for="standaloneVocabListSelect">
            <span>选择 List</span>
            <select id="standaloneVocabListSelect"></select>
          </label>
          <button id="standaloneVocabNext" type="button">下一组</button>
        </div>

        <div class="vocab-search">
          <input id="standaloneVocabSearchInput" type="search" placeholder="搜索单词 / 中文释义 / 主题">
          <button id="standaloneVocabClearSearch" type="button">清空</button>
        </div>

        <details class="vocab-audio-details">
          <summary>音频跟读</summary>
          <div class="vocab-jing-player standalone-vocab-player">
            <label for="standaloneVocabTrackSelect">词汇真经音频</label>
            <select id="standaloneVocabTrackSelect"></select>
            <audio id="standaloneVocabAudio" controls preload="none" referrerpolicy="strict-origin-when-cross-origin"></audio>
          </div>
        </details>
      </section>

      <section class="vocab-results-panel">
        <div class="vocab-results-head">
          <div>
            <span>词卡</span>
            <h2 id="standaloneVocabResultTitle">List 01</h2>
          </div>
          <strong id="standaloneVocabVisibleCount">0</strong>
        </div>
        <div id="standaloneVocabWords" class="vocab-jing-words"></div>
      </section>
    </main>
  </div>

  <script src="/assets/english/js/vocab-page.js?v=899ca5d2" defer></script>
</body>
</html>
