<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="雅思阅读">
  <title>雅思阅读训练 - 克睿斯</title>
  <meta name="description" content="雅思阅读文章、词汇、题型训练与解析。">
  <link rel="stylesheet" href="/assets/english/css/english.css?v=reading-levels-20260728">
</head>
<body class="vocab-standalone-body">
  <div class="reading-page">
    <header class="topbar vocab-topbar">
      <a class="brand" href="/english.html" aria-label="返回雅思100句">
        <span class="brand-mark">K</span>
        <span>
          <strong>雅思阅读</strong>
          <small>文章 · 词汇 · 题型</small>
        </span>
      </a>
      <a class="back-button" href="/english.html">返回 100 句</a>
    </header>

    <main class="reading-page-main">
      <section class="reading-workbench">
        <div class="reading-control-row">
          <div class="vocab-search reading-search-main">
            <input id="readingArticleSearch" type="search" placeholder="搜索主题 / 标题 / 关键词">
            <button id="readingClearSearch" type="button">清空</button>
          </div>
          <div class="reading-font-tools" aria-label="字号">
            <button type="button" data-font-size="normal" class="active">A</button>
            <button type="button" data-font-size="large">A+</button>
          </div>
        </div>
        <div id="readingTopicTabs" class="vocab-chapter-tabs reading-topic-tabs"></div>
        <div id="readingLevelTabs" class="vocab-chapter-tabs reading-level-tabs"></div>
        <div id="readingArticleList" class="reading-article-list"></div>
      </section>

      <article id="readingArticle" class="reading-article-panel">
        <div class="loading-state">正在加载阅读文章...</div>
      </article>
    </main>
  </div>

  <script src="/assets/english/js/reading-page.js?v=reading-levels-20260728" defer></script>
</body>
</html>
